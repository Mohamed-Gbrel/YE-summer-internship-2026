<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التسجيلات - YE Summer Internship 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e31b23;
            --primary-hover: #c41219;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-color: #111111;
            --muted-text: #666666;
            --border-color: #eeeeee;
        }
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 20px 15px;
        }
        /* ===== شاشة الدخول ===== */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .login-card h1 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 8px;
        }
        .login-card p {
            font-size: 14px;
            color: var(--muted-text);
            margin-bottom: 25px;
        }
        .login-card input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f4b2b5;
            border-radius: 14px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }
        .login-card button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-red);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .login-card button:hover {
            background-color: var(--primary-hover);
        }
        .login-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #loginError {
            color: var(--primary-red);
            font-size: 14px;
            font-weight: 700;
            margin-top: 12px;
            min-height: 18px;
        }
        /* ===== الداشبورد ===== */
        #dashboardScreen {
            display: none;
            max-width: 900px;
            margin: 0 auto;
        }
        #dashboardScreen.active {
            display: block;
        }
        .dash-header {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .dash-total {
            display: flex;
            flex-direction: column;
        }
        .dash-total .number {
            font-size: 42px;
            font-weight: 900;
            color: var(--primary-red);
            line-height: 1;
        }
        .dash-total .label {
            font-size: 14px;
            color: var(--muted-text);
            margin-top: 4px;
        }
        .dash-meta {
            text-align: left;
            direction: ltr;
        }
        .dash-meta .updated {
            font-size: 12px;
            color: var(--muted-text);
            margin-bottom: 8px;
        }
        .dash-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .refresh-btn {
            background-color: #f0f0f0;
            color: var(--text-color);
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .refresh-btn:hover {
            background-color: #e5e5e5;
        }
        .logout-btn {
            background-color: transparent;
            color: var(--muted-text);
            border: none;
            border-radius: 50px;
            padding: 10px 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
        .logout-btn:hover {
            color: var(--primary-red);
        }
        .refresh-status {
            font-size: 12px;
            color: var(--primary-red);
            margin-top: 8px;
            min-height: 14px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 25px 0 12px;
            color: var(--text-color);
        }
        /* ===== الفايزين ===== */
        .winners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 10px;
        }
        .winner-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px 18px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            border-right: 4px solid var(--primary-red);
        }
        .winner-card .gov-name {
            font-size: 13px;
            color: var(--muted-text);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .winner-card .winner-name {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .winner-card .winner-stats {
            font-size: 13px;
            color: var(--muted-text);
        }
        /* ===== جدول المحافظات (التعديلات الجديدة هنا) ===== */
        .gov-details {
            background: var(--card-bg);
            border-radius: 18px;
            margin-bottom: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .gov-details summary {
            padding: 16px 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            user-select: none;
        }
        /* إخفاء السهم القديم */
        .gov-details summary::-webkit-details-marker {
            display: none;
        }
        /* تصميم السهم الجديد */
        .toggle-icon {
            display: inline-block;
            font-size: 12px;
            color: var(--primary-red);
            transition: transform 0.3s ease;
        }
        /* لف السهم لما المحافظة تتفتح */
        .gov-details[open] .toggle-icon {
            transform: rotate(180deg);
        }
        
        .gov-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .gov-summary-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted-text);
        }
        .gov-summary-stats b {
            color: var(--text-color);
        }
        .entity-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background-color: #fafafa;
        }
        .entity-table th,
        .entity-table td {
            padding: 12px 20px;
            text-align: right;
            border-top: 1px solid var(--border-color);
        }
        .entity-table th {
            color: var(--muted-text);
            font-weight: 700;
            font-size: 12px;
        }
        #emptyState {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted-text);
        }
        @media (max-width: 480px) {
            .dash-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .dash-meta {
                text-align: right;
                direction: rtl;
                width: 100%;
            }
        }
    </style>
</head>

    const AUTO_REFRESH_INTERVAL_MS = 60 * 60 * 1000; // ساعة بالميلي ثانية
    let autoRefreshTimer = null;

    function startAutoRefresh() {
        if (autoRefreshTimer) return; // شغال أصلاً، متبدأش تاني تايمر جديد
        autoRefreshTimer = setInterval(function () {
            fetchDashboardData(true); // true = silent، عشان لو حصل خطأ مؤقت ميرجعكش لشاشة تسجيل الدخول
        }, AUTO_REFRESH_INTERVAL_MS);
    }

    function stopAutoRefresh() {
        if (autoRefreshTimer) {
            clearInterval(autoRefreshTimer);
            autoRefreshTimer = null;
        }
    }

    asyncفهمت قصدك بالظبط! الكود بتاعك فعلاً بيستخدم टैج `<details>` و `<summary>` اللي بيعملوا فكرة الفتح والقفل دي بشكل افتراضي، بس المشكلة إن مفيش **شكل أو علامة (زي + و -)** توضح لليوزر إن دي حاجة بتتداس عليها عشان تفتح التفاصيل.

عشان نعملها زي ما أنت عاوز بالظبط (علامة **+** تفتح، وتتحول لـ **-** لما تفتح شكلها شيك ومتناسق مع الديزاين بتاعك)، هنعدل حتة صغيرة في الـ `CSS` وفي الـ `JavaScript`.
