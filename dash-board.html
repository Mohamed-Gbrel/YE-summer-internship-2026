<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التسجيلات - YE Summer Internship 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e31b23;
            --primary-hover: #c41219;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-color: #111111;
            --muted-text: #666666;
            --border-color: #eeeeee;
        }
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 20px 15px;
        }
        /* ===== شاشة الدخول ===== */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .login-card h1 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 8px;
        }
        .login-card p {
            font-size: 14px;
            color: var(--muted-text);
            margin-bottom: 25px;
        }
        .login-card input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f4b2b5;
            border-radius: 14px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }
        .login-card button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-red);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .login-card button:hover {
            background-color: var(--primary-hover);
        }
        .login-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #loginError {
            color: var(--primary-red);
            font-size: 14px;
            font-weight: 700;
            margin-top: 12px;
            min-height: 18px;
        }
        /* ===== الداشبورد ===== */
        #dashboardScreen {
            display: none;
            max-width: 900px;
            margin: 0 auto;
        }
        #dashboardScreen.active {
            display: block;
        }
        .dash-header {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .dash-total {
            display: flex;
            flex-direction: column;
        }
        .dash-total .number {
            font-size: 42px;
            font-weight: 900;
            color: var(--primary-red);
            line-height: 1;
        }
        .dash-total .label {
            font-size: 14px;
            color: var(--muted-text);
            margin-top: 4px;
        }
        .dash-meta {
            text-align: left;
            direction: ltr;
        }
        .dash-meta .updated {
            font-size: 12px;
            color: var(--muted-text);
            margin-bottom: 8px;
        }
        .dash-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .refresh-btn {
            background-color: #f0f0f0;
            color: var(--text-color);
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .refresh-btn:hover {
            background-color: #e5e5e5;
        }
        .logout-btn {
            background-color: transparent;
            color: var(--muted-text);
            border: none;
            border-radius: 50px;
            padding: 10px 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
        .logout-btn:hover {
            color: var(--primary-red);
        }
        .refresh-status {
            font-size: 12px;
            color: var(--primary-red);
            margin-top: 8px;
            min-height: 14px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 25px 0 12px;
            color: var(--text-color);
        }
        
        /* ===== جدول المحافظات والتفاصيل ===== */
        .gov-details {
            background: var(--card-bg);
            border-radius: 18px;
            margin-bottom: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .gov-details summary {
            padding: 16px 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            user-select: none;
        }
        /* إخفاء السهم القديم */
        .gov-details summary::-webkit-details-marker {
            display: none;
        }
        
        /* ===== شكل أيقونة الفتح والقفل (+ / -) ===== */
        .gov-name-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toggle-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 28px;
            height: 28px;
            background-color: #ffe6e6;
            color: var(--primary-red);
            border-radius: 8px;
            font-size: 20px;
            font-weight: 900;
            transition: all 0.3s ease;
        }
        .toggle-icon::after {
            content: '+';
            margin-top: -2px;
        }
        /* الشكل لما المحافظة تتفتح */
        .gov-details[open] .toggle-icon {
            background-color: var(--primary-red);
            color: #ffffff;
            transform: rotate(180deg);
        }
        .gov-details[open] .toggle-icon::after {
            content: '-';
            margin-top: -4px;
        }
        .gov-details summary:hover .toggle-icon {
            background-color: var(--primary-red);
            color: #ffffff;
        }

        .gov-summary-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted-text);
        }
        .gov-summary-stats b {
            color: var(--text-color);
            font-size: 15px;
        }
        
        .entity-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background-color: #fafafa;
        }
        .entity-table th,
        .entity-table td {
            padding: 12px 20px;
            text-align: right;
            border-top: 1px solid var(--border-color);
        }
        .entity-table th {
            color: var(--muted-text);
            font-weight: 700;
            font-size: 12px;
        }
        #emptyState {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted-text);
        }
        
        @media (max-width: 480px) {
            .dash-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .dash-meta {
                text-align: right;
                direction: rtl;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- ===== شاشة الدخول ===== -->
    <div id="loginScreen">
        <div class="login-card">
            <h1>لوحة تحكم التسجيلات</h1>
            <p>أدخل كلمة المرور للمتابعة</p>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off">
            <button id="loginBtn" onclick="attemptLogin()">دخول</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- ===== الداشبورد ===== -->
    <div id="dashboardScreen">
        <div class="dash-header">
            <div class="dash-total">
                <div class="number" id="totalCount">0</div>
                <div class="label">إجمالي التسجيلات</div>
            </div>
            <div class="dash-meta">
                <div class="updated" id="lastUpdated"></div>
                <div class="dash-actions">
                    <button class="refresh-btn" onclick="fetchDashboardData()">تحديث البيانات</button>
                    <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
                </div>
                <div class="refresh-status" id="refreshStatus"></div>
            </div>
        </div>
        
        <div id="winnersSection"></div>
        
        <div class="section-title">التسجيلات حسب المحافظة</div>
        <div id="governoratesList"></div>
        <div id="emptyState" style="display: none;">لا توجد بيانات تسجيل بعد.</div>
    </div>

<script>
    // ⚠️ حط هنا رابط الـ Apps Script الجديد بتاع الداشبورد (بعد الديبلوي)
    const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbxJZ8G0DbhhdqoX_BP5v03gkfkHeWGAZdoZLGFfx5H29DmGyauc8D47ivjdegwV800/exec';

    // مفتاح تخزين كلمة المرور في localStorage
    const SAVED_PASSWORD_KEY = 'dashboard_saved_password';
    let currentPassword = ""; 

    // ===== تحديث تلقائي كل ساعة =====
    const AUTO_REFRESH_INTERVAL_MS = 60 * 60 * 1000; 
    let autoRefreshTimer = null;

    function startAutoRefresh() {
        if (autoRefreshTimer) return; 
        autoRefreshTimer = setInterval(function () {
            fetchDashboardData(true); 
        }, AUTO_REFRESH_INTERVAL_MS);
    }

    function stopAutoRefresh() {
        if (autoRefreshTimer) {
            clearInterval(autoRefreshTimer);
            autoRefreshTimer = null;
        }
    }

    // فحص إذا كان المستخدم مسجل دخول من قبل
    window.onload = function() {
        const savedPassword = localStorage.getItem(SAVED_PASSWORD_KEY);
        if (savedPassword) {
            currentPassword = savedPassword;
            document.getElementById('passwordInput').value = currentPassword;
            attemptLogin();
        }
    };

    // تسجيل الدخول
    async function attemptLogin() {
        const passInput = document.getElementById('passwordInput').value;
        if (!passInput) return;
        
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('loginError');
        
        loginBtn.disabled = true;
        loginBtn.innerText = 'جاري التحقق...';
        errorDiv.innerText = '';
        currentPassword = passInput;

        await fetchDashboardData(false);
    }

    // جلب البيانات من الجوجل شيت
    async function fetchDashboardData(isSilent = false) {
        const refreshStatus = document.getElementById('refreshStatus');
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('loginError');

        if (!isSilent) {
            refreshStatus.innerText = 'جاري التحديث...';
        }

        try {
            // استدعاء الرابط مع تمرير الباسورد
            const response = await fetch(`${DASHBOARD_URL}?password=${encodeURIComponent(currentPassword)}`);
            const data = await response.json();

            if (data.status === 'success') {
                // نجاح الدخول والتحديث
                localStorage.setItem(SAVED_PASSWORD_KEY, currentPassword);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').classList.add('active');
                
                // تحديث الواجهة بالبيانات
                updateDashboardUI(data);
                
                const now = new Date();
                document.getElementById('lastUpdated').innerText = 'آخر تحديث: ' + now.toLocaleTimeString('ar-EG');
                if (!isSilent) refreshStatus.innerText = '';
                
                startAutoRefresh();
            } else {
                // فشل الدخول (باسورد غلط)
                localStorage.removeItem(SAVED_PASSWORD_KEY);
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('dashboardScreen').classList.remove('active');
                stopAutoRefresh();
                
                if (!isSilent) {
                    errorDiv.innerText = 'كلمة المرور غير صحيحة';
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'دخول';
                }
            }
        } catch (error) {
            if (!isSilent) {
                refreshStatus.innerText = 'حدث خطأ في الاتصال، حاول مرة أخرى.';
                loginBtn.disabled = false;
                loginBtn.innerText = 'دخول';
            }
        }
    }

    // تسجيل الخروج
    function logout() {
        localStorage.removeItem(SAVED_PASSWORD_KEY);
        currentPassword = "";
        document.getElementById('passwordInput').value = "";
        stopAutoRefresh();
        
        document.getElementById('dashboardScreen').classList.remove('active');
        document.getElementById('loginScreen').style.display = 'flex';
        
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = false;
        loginBtn.innerText = 'دخول';
    }

    // دالة رسم المحافظات والتفاصيل
    function updateDashboardUI(data) {
        // تحديث إجمالي التسجيلات
        document.getElementById('totalCount').innerText = data.total || 0;

        const govList = document.getElementById('governoratesList');
        const emptyState = document.getElementById('emptyState');
        
        govList.innerHTML = ''; // تنظيف القائمة القديمة

        // لو مفيش بيانات
        if (!data.governorates || data.governorates.length === 0) {
            emptyState.style.display = 'block';
            return;
        } else {
            emptyState.style.display = 'none';
        }

        // رسم كل محافظة باستخدام details و summary 
        data.governorates.forEach(gov => {
            const detailsElement = document.createElement('details');
            detailsElement.className = 'gov-details';

            // رأس المحافظة (الاسم + التوتال + الأيقونة)
            const summaryElement = document.createElement('summary');
            summaryElement.innerHTML = `
                <div class="gov-name-wrapper">
                    <span class="toggle-icon"></span>
                    <span class="gov-name">${gov.name}</span>
                </div>
                <div class="gov-summary-stats">
                    <span><b>${gov.count}</b> تسجيل</span>
                </div>
            `;
            detailsElement.appendChild(summaryElement);

            // جدول تفاصيل المسجلين في المحافظة دي
            if (gov.users && gov.users.length > 0) {
                const table = document.createElement('table');
                table.className = 'entity-table';
                
                // الهيدر بتاع الجدول
                table.innerHTML = `
                    <tr>
                        <th>الاسم</th>
                        <th>الجامعة/الكيان</th>
                        <th>رقم التليفون</th>
                    </tr>
                `;
                
                // بيانات الناس
                gov.users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.name || '-'}</td>
                        <td>${user.entity || '-'}</td>
                        <td><a href="https://wa.me/2${user.phone}" target="_blank" style="color:var(--primary-red);text-decoration:none;">${user.phone || '-'}</a></td>
                    `;
                    table.appendChild(tr);
                });
                
                detailsElement.appendChild(table);
            } else {
                // لو مفيش تفاصيل مبعوتة للمحافظة
                const noData = document.createElement('div');
                noData.style.padding = '15px 20px';
                noData.style.color = 'var(--muted-text)';
                noData.innerText = 'لا توجد تفاصيل متاحة';
                detailsElement.appendChild(noData);
            }

            govList.appendChild(detailsElement);
        });
    }

    // السماح بالضغط على Enter لتسجيل الدخول
    document.getElementById("passwordInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            attemptLogin();
        }
    });
</script>
</body>
</html>
