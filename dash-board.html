<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التسجيلات - YE Summer Internship 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e31b23;
            --primary-hover: #c41219;
            --gold: #d4a017;
            --bg-color: #f2f2f2;
            --card-bg: #ffffff;
            --text-color: #111111;
            --muted-text: #6c757d;
            --border-color: #eeeeee;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 20px 15px 60px;
        }

        /* ===== شاشة الدخول ===== */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .login-card p {
            font-size: 14px;
            color: var(--muted-text);
            margin-bottom: 25px;
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f4b2b5;
            border-radius: 14px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-red);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .login-card button:hover {
            background-color: var(--primary-hover);
        }

        .login-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginError {
            color: var(--primary-red);
            font-size: 14px;
            font-weight: 700;
            margin-top: 12px;
            min-height: 18px;
        }

        /* ===== الداشبورد ===== */
        #dashboardScreen {
            display: none;
        }

        #dashboardScreen.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto 20px;
        }
        .header h1 { font-size: clamp(18px, 4vw, 24px); font-weight: 900; }

        .dash-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .dash-meta .updated {
            font-size: 12px;
            color: var(--muted-text);
        }

        .refresh-btn {
            background-color: #fff;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 18px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .refresh-btn:hover {
            background-color: #f5f5f5;
        }

        /* ===== إجمالي عام ===== */
        .total-card {
            max-width: 1200px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, var(--primary-red), #b3141a);
            color: #fff;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(227,27,35,.25);
        }
        .total-card .num { font-size: clamp(38px, 7vw, 56px); font-weight: 900; line-height: 1; }
        .total-card .label { font-size: 15px; font-weight: 700; opacity: .9; margin-top: 8px; }

        /* ===== كنترولز عامة ===== */
        .controls {
            max-width: 1200px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        select.filter, input.search {
            font-family: 'Cairo', sans-serif;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
        }
        input.search { cursor: text; flex: 1; min-width: 180px; }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 25px auto 12px;
            color: var(--text-color);
            max-width: 1200px;
        }

        /* ===== الفايزين ===== */
        .winners-grid {
            max-width: 1200px;
            margin: 0 auto 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .winner-card {
            background: linear-gradient(135deg, #fff8e6, #fff);
            border: 2px solid var(--gold);
            border-radius: 18px;
            padding: 16px 18px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .winner-card .trophy { font-size: 24px; line-height: 1; }

        .winner-card .gov-name {
            font-size: 12px;
            color: var(--muted-text);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .winner-card .winner-name {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .winner-card .winner-stats {
            font-size: 12px;
            color: var(--muted-text);
        }

        /* ===== كارت محافظة ===== */
        .governorates-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 18px;
        }
        .gov-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,.06);
            overflow: hidden;
        }
        .gov-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .gov-header h3 { font-size: 17px; font-weight: 800; }
        .gov-total-badge {
            background: #fdeceb;
            color: var(--primary-red);
            font-size: 13px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 50px;
            white-space: nowrap;
        }
        .gov-body { padding: 16px 20px; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted-text);
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-row .val { font-weight: 800; color: var(--text-color); }

        .entity-list { margin-top: 10px; }
        .entity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
        }
        .entity-item .name { color: var(--text-color); font-weight: 600; }
        .entity-item .nums { display: flex; gap: 10px; color: var(--muted-text); font-size: 12px; white-space: nowrap; }
        .entity-item .nums b { color: var(--primary-red); }

        .section-label {
            font-size: 12px;
            font-weight: 800;
            color: var(--muted-text);
            margin-top: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .empty-note { font-size: 12px; color: var(--muted-text); text-align: center; padding: 8px 0; }

        #emptyState {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted-text);
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- ===== شاشة الدخول ===== -->
    <div id="loginScreen">
        <div class="login-card">
            <h1>لوحة تحكم التسجيلات</h1>
            <p>أدخل كلمة المرور للمتابعة</p>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off">
            <button id="loginBtn" onclick="attemptLogin()">دخول</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- ===== الداشبورد ===== -->
    <div id="dashboardScreen">
        <div class="header">
            <h1>Dashboard - YE Summer Internship 2026</h1>
            <div class="dash-meta">
                <div class="updated" id="lastUpdated"></div>
                <button class="refresh-btn" onclick="fetchDashboardData()">تحديث البيانات</button>
            </div>
        </div>

        <div class="total-card">
            <div class="num" id="totalCount">0</div>
            <div class="label">إجمالي التسجيلات</div>
        </div>

        <div class="controls">
            <input type="text" id="searchBox" class="search" placeholder="ابحث عن محافظة..." oninput="onSearchChange(this.value)">
            <select id="sortSelect" class="filter" onchange="onSortChange(this.value)">
                <option value="count_desc">الأكتر تسجيلاً أولاً</option>
                <option value="count_asc">الأقل تسجيلاً أولاً</option>
                <option value="name">ترتيب أبجدي</option>
            </select>
        </div>

        <div id="winnersSection"></div>

        <div class="section-title">التسجيلات حسب المحافظة</div>
        <div id="governoratesList" class="governorates-grid"></div>

        <div id="emptyState" style="display: none;">لا توجد بيانات تسجيل بعد.</div>
    </div>

<script>
     // ⚠️ حط هنا رابط الـ Apps Script الجديد بتاع الداشبورد (بعد الديبلوي)
    const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbyA4fLxOWnoCT12Wd0GLzNlK8DFAEWhPzADkRT5SCSWaTNQOqqMnDJ5Wtq14CXh528h/exec';
    // ⚠️ تأكد إنك حاطط رابط الـ Web App الأخير والجديد (بعد ما عملت New Version في الـ Deploy)
    const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbyN-_mt9BD_0pBgODc6SvP36A3oyZNa89myc1cYV6FTw79Cdwg9J3Nm8-6EdF2wwf8S/exec';


    let currentPassword = ""; // بيتخزن في الذاكرة بس (متغير JS)، مش localStorage
                               // فبيتمسح تلقائيًا لما الصفحة تتقفل أو تتعمل reload

    let lastData = null;
    let searchTerm = '';
    let sortMode = 'count_desc';

    async function attemptLogin() {
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const password = passwordInput.value;

        if (!password) {
            loginError.innerText = "برجاء إدخال كلمة المرور.";
            return;
        }

        loginBtn.disabled = true;
        loginBtn.innerText = "جاري التحقق...";
        loginError.innerText = "";

        currentPassword = password;
        const success = await fetchDashboardData();

        loginBtn.disabled = false;
        loginBtn.innerText = "دخول";

        if (!success) {
            currentPassword = "";
            passwordInput.value = "";
        }
    }

    async function fetchDashboardData() {
        const loginError = document.getElementById('loginError');
        try {
            const response = await fetch(DASHBOARD_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ password: currentPassword })
            });

            const result = await response.json();

            if (result.status !== "success") {
                loginError.innerText = result.message || "حدث خطأ، برجاء المحاولة مرة أخرى.";
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('dashboardScreen').classList.remove('active');
                return false;
            }

            lastData = result;
            renderDashboard(result);
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').classList.add('active');
            return true;

        } catch (err) {
            console.error(err);
            loginError.innerText = "تعذر الاتصال بالخادم، تأكد من اتصالك بالإنترنت.";
            return false;
        }
    }

    function onSearchChange(val) {
        searchTerm = val.trim();
        if (lastData) renderDashboard(lastData);
    }
    function onSortChange(val) {
        sortMode = val;
        if (lastData) renderDashboard(lastData);
    }

    function renderEntityList(byEntity) {
        if (!byEntity.length) return '<div class="empty-note">لا يوجد بيانات اتحادات</div>';
        return byEntity.map(ent => `
            <div class="entity-item">
                <span class="name">${escapeHtml(ent.entity)}</span>
                <span class="nums"><b>${ent.count}</b> مسجل &middot; ${ent.certs} شهادة</span>
            </div>
        `).join('');
    }

    function renderGovCard(name, gov) {
        return `
            <div class="gov-card">
                <div class="gov-header">
                    <h3>${escapeHtml(name)}</h3>
                    <span class="gov-total-badge">${gov.total} مسجل</span>
                </div>
                <div class="gov-body">
                    <div class="stat-row"><span>إجمالي الشهادات</span><span class="val">${gov.totalCerts}</span></div>
                    <div class="stat-row"><span>أصدقاء مرشحين</span><span class="val">${gov.friendReferredCount || 0}</span></div>

                    <div class="section-label">📊 التوزيع حسب الاتحاد</div>
                    <div class="entity-list">${renderEntityList(gov.byEntity)}</div>
                </div>
            </div>
        `;
    }

    function renderDashboard(data) {
        document.getElementById('totalCount').innerText = data.totalCount;
        document.getElementById('lastUpdated').innerText = "آخر تحديث: " + formatDate(data.lastUpdated);

        const allGovNames = Object.keys(data.governorates);

        if (allGovNames.length === 0) {
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('winnersSection').innerHTML = '';
            document.getElementById('governoratesList').innerHTML = '';
            return;
        }

        document.getElementById('emptyState').style.display = 'none';

        // ===== قسم الفايزين =====
        const winnersHtml = allGovNames
            .filter(gov => data.governorates[gov].winner)
            .map(gov => {
                const w = data.governorates[gov].winner;
                return `
                    <div class="winner-card">
                        <div class="trophy">🏆</div>
                        <div class="info">
                            <div class="gov-name">${escapeHtml(gov)}</div>
                            <div class="winner-name">${escapeHtml(w.name)}</div>
                            <div class="winner-stats">${w.referredCount} ترشيح &middot; ${w.followersCount} متابع</div>
                        </div>
                    </div>
                `;
            }).join('');

        if (winnersHtml) {
            document.getElementById('winnersSection').innerHTML = `
                <div class="section-title">الفائزين (الأكثر ترشيحاً - YLY)</div>
                <div class="winners-grid">${winnersHtml}</div>
            `;
        } else {
            document.getElementById('winnersSection').innerHTML = '';
        }

        // ===== كروت المحافظات مع البحث والترتيب =====
        let entries = allGovNames.map(name => ({ name: name, gov: data.governorates[name] }));

        if (searchTerm) {
            entries = entries.filter(e => e.name.includes(searchTerm));
        }

        if (sortMode === 'count_desc') {
            entries.sort((a, b) => b.gov.total - a.gov.total);
        } else if (sortMode === 'count_asc') {
            entries.sort((a, b) => a.gov.total - b.gov.total);
        } else {
            entries.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
        }

        if (entries.length === 0) {
            document.getElementById('governoratesList').innerHTML = '<div class="empty-note" style="grid-column:1/-1; padding:30px;">لا يوجد نتائج مطابقة</div>';
            return;
        }

        document.getElementById('governoratesList').innerHTML = entries.map(e => renderGovCard(e.name, e.gov)).join('');
    }

    // بيحول أي نص لصيغة آمنة قبل إدراجه في الصفحة (حماية من XSS)
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        try {
            const d = new Date(dateStr);
            return d.toLocaleString('ar-EG');
        } catch (e) {
            return dateStr;
        }
    }

    document.getElementById('passwordInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            attemptLogin();
        }
    });
</script>
</body>
</html>
