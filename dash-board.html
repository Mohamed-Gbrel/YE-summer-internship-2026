<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التسجيلات - YE Summer Internship 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e31b23;
            --primary-hover: #c41219;
            --bg-color: #eef2f5;
            --card-bg: #ffffff;
            --text-color: #111111;
            --muted-text: #666666;
            --border-color: #eeeeee;
        }
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 20px 15px;
        }
        
        /* ===== شاشة الدخول ===== */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.10);
            text-align: center;
        }
        .login-card h1 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
        .login-card p { font-size: 14px; color: var(--muted-text); margin-bottom: 25px; }
        .login-card input[type="password"] {
            width: 100%; padding: 14px 16px; border: 2px solid #f4b2b5;
            border-radius: 14px; font-size: 16px; outline: none;
            margin-bottom: 15px; text-align: center;
        }
        .login-card button {
            width: 100%; padding: 14px; background-color: var(--primary-red);
            color: #ffffff; border: none; border-radius: 50px; font-size: 17px;
            font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .login-card button:hover { background-color: var(--primary-hover); }
        .login-card button:disabled { opacity: 0.6; cursor: not-allowed; }
        #loginError { color: var(--primary-red); font-size: 14px; font-weight: 700; margin-top: 12px; min-height: 18px; }

        /* ===== الداشبورد ===== */
        #dashboardScreen {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }
        #dashboardScreen.active { display: block; }
        
        /* الهيدر الموحد */
        .dash-header {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .dash-stats-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 15px;
        }
        .dash-stat-box {
            flex: 1;
            text-align: center;
        }
        .dash-stat-box .number {
            font-size: 42px;
            font-weight: 900;
            color: var(--primary-red);
            line-height: 1;
        }
        .dash-stat-box .label {
            font-size: 14px;
            color: var(--muted-text);
            margin-top: 5px;
            font-weight: 600;
        }
        .dash-meta {
            width: 100%;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .dash-meta .updated { font-size: 13px; color: var(--muted-text); margin-bottom: 12px; }
        .dash-actions { display: flex; gap: 10px; justify-content: center; width: 100%; }
        
        .refresh-btn {
            background-color: #f0f0f0; color: var(--text-color); border: none;
            border-radius: 50px; padding: 10px 25px; font-weight: 700; cursor: pointer;
        }
        .logout-btn {
            background-color: transparent; color: var(--muted-text); border: none;
            font-weight: 700; cursor: pointer; text-decoration: underline;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 900;
            margin: 30px 0 15px;
            color: var(--text-color);
            text-align: right;
        }

        /* ===== إحصائيات الاتحادات ===== */
        .entities-grid {
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;
        }
        .entity-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
            text-align: right;
        }
        .entity-card-header {
            font-size: 16px; font-weight: 800; color: var(--muted-text); margin-bottom: 8px;
        }
        .entity-main-stat {
            font-size: 42px; font-weight: 900; color: var(--primary-red); margin-bottom: 12px; line-height: 1;
        }
        .entity-sub-stats {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; font-weight: 600; color: var(--muted-text);
            padding: 12px 0 0 0;
            border-top: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        .entity-footer {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; font-weight: 700; color: var(--text-color);
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        /* تنسيقات اللجان لـ YLY */
        .yly-committees {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-weight: normal;
        }
        .committee-stat span {
            color: var(--text-color);
            font-weight: 700;
        }

        /* ===== الفايزين ===== */
        .winners-grid {
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;
        }
        .winner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
            border-right: 5px solid var(--primary-red);
            text-align: right;
        }
        .winner-card .gov-name { font-size: 14px; color: var(--muted-text); font-weight: 700; margin-bottom: 5px; }
        .winner-card .winner-name { font-size: 19px; font-weight: 900; margin-bottom: 8px; color: #111; }
        .winner-card .winner-stats { font-size: 14px; color: var(--muted-text); font-weight: 600; }

        /* ===== جدول المحافظات القابل للفتح ===== */
        .gov-details {
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .gov-details[open] {
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .gov-details summary {
            padding: 20px;
            cursor: pointer;
            font-weight: 900;
            font-size: 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
        }
        .gov-details summary::-webkit-details-marker { display: none; }
        .gov-summary-stats {
            display: flex; gap: 15px; font-size: 14px; font-weight: 700; color: var(--muted-text);
        }
        .gov-summary-stats b { color: var(--text-color); }
        
        .gov-content {
            padding: 0 20px 20px 20px;
        }

        /* الجداول الداخلية */
        .inner-table-title {
            font-size: 15px; font-weight: 800; color: #111; margin: 15px 0 10px; text-align: center;
        }
        .data-table {
            width: 100%; border-collapse: collapse; font-size: 13px; text-align: center;
            background: #fafafa; border-radius: 10px; overflow: hidden;
        }
        .data-table th {
            background: #f0f0f0; color: var(--muted-text); font-weight: 800; padding: 12px 5px;
        }
        .data-table td {
            padding: 12px 5px; border-bottom: 1px solid var(--border-color); font-weight: 600;
        }
        .data-table tr:last-child td { border-bottom: none; }

        #emptyState { text-align: center; padding: 60px 20px; color: var(--muted-text); font-weight: bold; }
    </style>
</head>
<body>

    <!-- ===== شاشة الدخول ===== -->
    <div id="loginScreen">
        <div class="login-card">
            <h1>لوحة تحكم التسجيلات</h1>
            <p>أدخل كلمة المرور للمتابعة</p>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off">
            <button id="loginBtn" onclick="attemptLogin()">دخول</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- ===== الداشبورد ===== -->
    <div id="dashboardScreen">
        
        <!-- الهيدر الموحد -->
        <div class="dash-header">
            <div class="dash-stats-row">
                <div class="dash-stat-box">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">إجمالي التسجيلات</div>
                </div>
                <div class="dash-stat-box">
                    <div class="number" id="totalCertsCount">0</div>
                    <div class="label">إجمالي الشهادات</div>
                </div>
            </div>
            <div class="dash-meta">
                <div class="updated" id="lastUpdated"></div>
                <div class="dash-actions">
                    <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
                    <button class="refresh-btn" onclick="fetchDashboardData()">تحديث البيانات</button>
                </div>
                <div class="refresh-status" id="refreshStatus" style="color:red; font-size:12px; margin-top:5px; text-align:center;"></div>
            </div>
        </div>

        <!-- إحصائيات الاتحادات (إجمالي عام) -->
        <div id="entityTotalsSection"></div>

        <!-- الفائزين -->
        <div id="winnersSection"></div>

        <!-- المحافظات -->
        <div class="section-title">التسجيلات حسب المحافظة</div>
        <div id="governoratesList"></div>

        <div id="emptyState" style="display: none;">لا توجد بيانات تسجيل بعد.</div>
    </div>

<script>
    const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbxJZ8G0DbhhdqoX_BP5v03gkfkHeWGAZdoZLGFfx5H29DmGyauc8D47ivjdegwV800/exec';
    const SAVED_PASSWORD_KEY = 'dashboard_saved_password';
    let currentPassword = ""; 
    let autoRefreshTimer = null;

    function isValidEntity(entityName) {
        if (!entityName) return false;
        const cleaned = entityName.trim();
        if (
            cleaned === "" || 
            cleaned.includes("الاتحاد المنضم اليه") || 
            cleaned.includes("الاتحاد المنضم إليه") ||
            cleaned.toLowerCase() === "undefined" ||
            cleaned.toLowerCase() === "null"
        ) {
            return false;
        }
        return true;
    }

    function isValidGovernorate(govName) {
        if (!govName) return false;
        const cleaned = govName.trim();
        if (
            cleaned === "" || 
            cleaned.includes("المحافظة/التيم التابع له") ||
            cleaned.includes("المحافظة / التيم التابع له") ||
            (cleaned.includes("المحافظة") && cleaned.includes("التيم")) ||
            cleaned.includes("التابع له") ||
            cleaned.toLowerCase() === "undefined" ||
            cleaned.toLowerCase() === "null"
        ) {
            return false;
        }
        return true;
    }

    function getEntityFollowers(entityName, data) {
        let total = 0;
        if (!data.governorates) return 0;
        for (let gov in data.governorates) {
            const g = data.governorates[gov];
            if (g && g.referrersByEntity && g.referrersByEntity[entityName]) {
                g.referrersByEntity[entityName].forEach(r => {
                    total += (Number(r.followersCount) || 0);
                });
            }
        }
        return total;
    }

    function startAutoRefresh() {
        if (autoRefreshTimer) return;
        autoRefreshTimer = setInterval(function () {
            fetchDashboardData(true); 
        }, 60 * 60 * 1000);
    }
    function stopAutoRefresh() {
        if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    }

    async function attemptLogin() {
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const password = passwordInput.value;
        if (!password) { loginError.innerText = "برجاء إدخال كلمة المرور."; return; }
        
        loginBtn.disabled = true; loginBtn.innerText = "جاري التحقق..."; loginError.innerText = "";
        currentPassword = password;
        
        const success = await fetchDashboardData();
        
        loginBtn.disabled = false; loginBtn.innerText = "دخول";
        if (success) {
            try { localStorage.setItem(SAVED_PASSWORD_KEY, password); } catch (e) {}
        } else {
            currentPassword = ""; passwordInput.value = "";
        }
    }

    async function tryAutoLogin() {
        let savedPassword = null;
        try { savedPassword = localStorage.getItem(SAVED_PASSWORD_KEY); } catch (e) {}
        if (!savedPassword) return;

        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        passwordInput.disabled = true; loginBtn.disabled = true; loginBtn.innerText = "جاري الدخول...";
        currentPassword = savedPassword;

        const success = await fetchDashboardData();
        
        passwordInput.disabled = false; loginBtn.disabled = false; loginBtn.innerText = "دخول";
        if (!success) {
            try { localStorage.removeItem(SAVED_PASSWORD_KEY); } catch (e) {}
            currentPassword = ""; passwordInput.value = "";
            document.getElementById('loginError').innerText = "انتهت صلاحية الجلسة، برجاء إدخال كلمة المرور.";
        }
    }

    function logout() {
        try { localStorage.removeItem(SAVED_PASSWORD_KEY); } catch (e) {}
        currentPassword = ""; stopAutoRefresh();
        document.getElementById('dashboardScreen').classList.remove('active');
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('passwordInput').value = "";
    }

    async function fetchDashboardData(silent) {
        const loginError = document.getElementById('loginError');
        const refreshStatus = document.getElementById('refreshStatus');
        const isInsideDashboard = document.getElementById('dashboardScreen').classList.contains('active');
        
        try {
            const response = await fetch(DASHBOARD_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ password: currentPassword })
            });
            const result = await response.json();
            
            if (result.status !== "success") {
                if (isInsideDashboard) {
                    if (!silent && refreshStatus) {
                        refreshStatus.innerText = result.message || "فشل التحديث";
                        setTimeout(() => refreshStatus.innerText = '', 3000);
                    }
                } else {
                    loginError.innerText = result.message || "حدث خطأ";
                    document.getElementById('loginScreen').style.display = 'flex';
                    document.getElementById('dashboardScreen').classList.remove('active');
                }
                return false;
            }
            
            if (refreshStatus) refreshStatus.innerText = '';
            renderDashboard(result);
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').classList.add('active');
            startAutoRefresh();
            return true;
        } catch (err) {
            if (isInsideDashboard && !silent && refreshStatus) {
                refreshStatus.innerText = "تعذر الاتصال بالخادم";
                setTimeout(() => refreshStatus.innerText = '', 3000);
            } else if (!silent && !isInsideDashboard) {
                loginError.innerText = "تعذر الاتصال بالخادم، تأكد من الإنترنت.";
            }
            return false;
        }
    }

    function renderDashboard(data) {
        document.getElementById('totalCount').innerText = data.totalCount;
        
        // حساب وعرض إجمالي الشهادات
        let totalCerts = 0;
        if (data.entityTotals && Array.isArray(data.entityTotals)) {
            totalCerts = data.entityTotals.reduce((sum, e) => sum + (Number(e.certs) || 0), 0);
        } else if (data.governorates) {
            for (let gov in data.governorates) {
                totalCerts += (Number(data.governorates[gov].totalCerts) || 0);
            }
        }
        document.getElementById('totalCertsCount').innerText = totalCerts;

        document.getElementById('lastUpdated').innerText = "آخر تحديث: " + formatDate(data.lastUpdated);
        
        const govNames = Object.keys(data.governorates || {}).filter(isValidGovernorate);
        
        govNames.sort((a, b) => {
            const getYlyCount = (gov) => {
                const g = data.governorates[gov];
                if (!g || !g.byEntity) return 0;
                const ylyObj = g.byEntity.find(e => e.entity && e.entity.toLowerCase().includes('yly'));
                return ylyObj ? ylyObj.count : 0;
            };
            return getYlyCount(b) - getYlyCount(a);
        });
        
        if (govNames.length === 0) {
            document.getElementById('emptyState').style.display = 'block';
            return;
        }
        document.getElementById('emptyState').style.display = 'none';

        // 1. قسم الاتحادات (إجمالي عام)
        if (data.entityTotals && data.entityTotals.length > 0) {
            const validEntities = data.entityTotals.filter(e => isValidEntity(e.entity));
            if (validEntities.length > 0) {
                const entitiesHtml = validEntities.map(e => {
                    const entityFollowers = getEntityFollowers(e.entity, data);
                    
                    // استخراج وتنسيق اللجان لو الاتحاد YLY
                    let committeesList = '';
                    if ((e.entity.toLowerCase().includes('yly') || e.entity.includes('يدير شباب')) && e.committees) {
                        committeesList = Object.entries(e.committees).map(([name, count]) => {
                            return `<div class="committee-stat">${escapeHtml(name)}: <span>${count}</span></div>`;
                        }).join('');
                    }

                    return `
                        <div class="entity-card">
                            <div class="entity-card-header">${escapeHtml(e.entity)}</div>
                            <div class="entity-main-stat">${e.total}</div>
                            
                            <div class="entity-sub-stats" style="align-items: flex-end;">
                                <div>عضو: ${e.memberCount}</div>
                                <div style="text-align: left;">
                                    ${committeesList ? `<div class="yly-committees">${committeesList}</div>` : ''}
                                    <div>صديق مرشح: ${e.friendCount}</div>
                                </div>
                            </div>
                            
                            <div class="entity-footer">
                                <span>${e.certs} شهادة</span>
                                <span>متابع: ${entityFollowers}</span>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('entityTotalsSection').innerHTML = `
                    <div class="section-title">التسجيلات حسب الاتحاد (إجمالي عام)</div>
                    <div class="entities-grid">${entitiesHtml}</div>
                `;
            } else {
                document.getElementById('entityTotalsSection').innerHTML = '';
            }
        }

        // 2. قسم الفائزين
        let allWinners = [];
        govNames.forEach(gov => {
            if (data.governorates[gov] && data.governorates[gov].winner) {
                allWinners.push({
                    gov: gov,
                    winner: data.governorates[gov].winner
                });
            }
        });

        allWinners.sort((a, b) => {
            const wa = a.winner;
            const wb = b.winner;
            
            const diffReferred = (wb.referredCount || 0) - (wa.referredCount || 0);
            if (diffReferred !== 0) return diffReferred;

            const diffFollowers = (wb.followersCount || 0) - (wa.followersCount || 0);
            if (diffFollowers !== 0) return diffFollowers;

            return (wb.totalCerts || 0) - (wa.totalCerts || 0);
        });

        const winnersHtml = allWinners.map(item => {
            const w = item.winner;
            return `
                <div class="winner-card">
                    <div class="gov-name">${escapeHtml(item.gov)}</div>
                    <div class="winner-name">${escapeHtml(w.name)}</div>
                    <div class="winner-stats">${w.referredCount} ترشيح · ${w.followersCount} متابع · ${w.totalCerts} شهادة</div>
                </div>
            `;
        }).join('');
            
        if (winnersHtml) {
            document.getElementById('winnersSection').innerHTML = `
                <div class="section-title">الفائزين (الأكثر ترشيحاً - YLY)</div>
                <div class="winners-grid">${winnersHtml}</div>
            `;
        } else {
            document.getElementById('winnersSection').innerHTML = '';
        }

        // 3. المحافظات وجداول التفاصيل
        const govsHtml = govNames.map((gov, index) => {
            const rank = index + 1;
            const g = data.governorates[gov];
            
            const validByEntity = (g.byEntity || []).filter(e => isValidEntity(e.entity));
            
            let innerContent = `
                <div class="inner-table-title">إحصائيات الاتحادات</div>
                <table class="data-table">
                    <thead><tr><th>الاتحاد</th><th>التسجيلات</th><th>الشهادات</th></tr></thead>
                    <tbody>
                        ${validByEntity.map(e => {
                            // إضافة تفاصيل لجان YLY لكل محافظة تحت اسم الاتحاد
                            let ylySubCommittees = '';
                            if ((e.entity.toLowerCase().includes('yly') || e.entity.includes('يدير شباب')) && e.committees) {
                                ylySubCommittees = `<div style="font-size: 11px; color: var(--muted-text); margin-top: 4px; font-weight: normal; line-height: 1.4;">` +
                                    Object.entries(e.committees).map(([cName, cCount]) => `${escapeHtml(cName)}: <b>${cCount}</b>`).join(' | ') +
                                    `</div>`;
                            }

                            return `
                                <tr>
                                    <td style="text-align: right; padding-right: 10px;">
                                        ${escapeHtml(e.entity)}
                                        ${ylySubCommittees}
                                    </td>
                                    <td>${e.count}</td>
                                    <td>${e.certs}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;

            for (let ent in g.referrersByEntity) {
                if (!isValidEntity(ent)) continue;
                let refs = g.referrersByEntity[ent];
                if (refs && refs.length > 0) {
                    innerContent += `
                        <div class="inner-table-title">المرشحين (${escapeHtml(ent)})</div>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>الاسم</th>
                                    <th>الترشيحات</th>
                                    <th>الشهادات</th>
                                    <th>متابع فيس</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${refs.map(r => `
                                    <tr>
                                        <td>${escapeHtml(r.name)}</td>
                                        <td>${r.referredCount}</td>
                                        <td>${r.totalCerts}</td>
                                        <td>${r.followersCount}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            }

            return `
                <details class="gov-details">
                    <summary>
                        <span>${rank}. ${escapeHtml(gov)}</span>
                        <span class="gov-summary-stats">
                            <span><b>${g.total}</b> تسجيل</span>
                            <span><b>${g.totalCerts}</b> شهادة</span>
                        </span>
                    </summary>
                    <div class="gov-content">
                        ${innerContent}
                    </div>
                </details>
            `;
        }).join('');
        
        document.getElementById('governoratesList').innerHTML = govsHtml;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        try {
            const d = new Date(dateStr);
            return d.toLocaleString('ar-EG');
        } catch (e) {
            return dateStr;
        }
    }

    document.getElementById('passwordInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') attemptLogin();
    });

    tryAutoLogin();
</script>
</body>
</html>
