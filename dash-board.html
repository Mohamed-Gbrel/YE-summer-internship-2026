<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - YE Summer Internship 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-red: #e31b23;
    --gold: #d4a017;
    --bg-color: #f2f2f2;
    --card-bg: #ffffff;
    --text-color: #111111;
    --muted: #6c757d;
    --border: #eee;
  }
  * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
  body { background: var(--bg-color); padding: 20px 15px 60px; min-height: 100vh; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    max-width: 1200px;
    margin: 0 auto 20px;
  }
  .header h1 { font-size: clamp(20px, 4vw, 26px); font-weight: 900; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #2ecc71;
    animation: pulse 1.8s infinite;
  }
  .dot.error { background: var(--primary-red); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,204,113,.5); }
    70% { box-shadow: 0 0 0 8px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }

  .error-banner {
    max-width: 1200px; margin: 0 auto 15px;
    background: #fdeceb; color: var(--primary-red);
    padding: 12px 18px; border-radius: 12px;
    font-size: 14px; font-weight: 700;
  }
  .last-updated { max-width: 1200px; margin: 0 auto 15px; font-size: 12px; color: var(--muted); }

  /* ===== إجمالي عام ===== */
  .total-card {
    max-width: 1200px;
    margin: 0 auto 25px;
    background: linear-gradient(135deg, var(--primary-red), #b3141a);
    color: #fff;
    border-radius: 24px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(227,27,35,.25);
  }
  .total-card .num { font-size: clamp(38px, 7vw, 56px); font-weight: 900; line-height: 1; }
  .total-card .label { font-size: 15px; font-weight: 700; opacity: .9; margin-top: 8px; }

  /* ===== كنترولز عامة ===== */
  .controls {
    max-width: 1200px;
    margin: 0 auto 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  select.filter, input.search {
    font-family: 'Cairo', sans-serif;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    background: #fff;
    cursor: pointer;
  }
  input.search { cursor: text; flex: 1; min-width: 180px; }

  /* ===== كارت محافظة ===== */
  .governorates-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px;
  }
  .gov-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
    overflow: hidden;
  }
  .gov-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .gov-header h3 { font-size: 17px; font-weight: 800; }
  .gov-total-badge {
    background: #fdeceb;
    color: var(--primary-red);
    font-size: 13px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 50px;
    white-space: nowrap;
  }
  .gov-body { padding: 16px 20px; }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .val { font-weight: 800; color: var(--text-color); }

  .entity-list { margin-top: 10px; }
  .entity-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 6px 0;
  }
  .entity-item .name { color: var(--text-color); font-weight: 600; }
  .entity-item .nums { display: flex; gap: 10px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .entity-item .nums b { color: var(--primary-red); }

  .section-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--muted);
    margin-top: 14px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== قسم المرشحين (YLY) ===== */
  .referrers-box {
    background: #faf9f7;
    border-radius: 14px;
    padding: 10px 12px;
    margin-top: 6px;
  }
  .referrer-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--border);
  }
  .referrer-item:last-child { border-bottom: none; }
  .referrer-item .rname { font-weight: 700; }
  .referrer-item .rnums { color: var(--muted); display: flex; gap: 8px; white-space: nowrap; }

  /* ===== كارت الفائز ===== */
  .winner-box {
    margin-top: 12px;
    background: linear-gradient(135deg, #fff8e6, #fff);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .winner-box .trophy { font-size: 26px; line-height: 1; }
  .winner-box .info { flex: 1; }
  .winner-box .wname { font-weight: 900; font-size: 14px; color: var(--text-color); }
  .winner-box .wstats { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .empty-note { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 0; }

  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,.9);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    z-index: 999;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #f4b2b5;
    border-top-color: var(--primary-red);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <div>جاري تحميل البيانات...</div>
</div>

<div class="header">
  <h1>Dashboard - YE Summer Internship 2026</h1>
  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">بيتحدث كل 10 ثواني</span>
  </div>
</div>

<div id="errorBanner" class="error-banner hidden"></div>
<div id="lastUpdated" class="last-updated"></div>

<div class="total-card">
  <div id="totalNum" class="num">0</div>
  <div class="label">إجمالي التسجيلات</div>
</div>

<div class="controls">
  <input type="text" id="searchBox" class="search" placeholder="ابحث عن محافظة..." oninput="onSearchChange(this.value)">
  <select id="sortSelect" class="filter" onchange="onSortChange(this.value)">
    <option value="count_desc">الأكتر تسجيلاً أولاً</option>
    <option value="count_asc">الأقل تسجيلاً أولاً</option>
    <option value="name">ترتيب أبجدي</option>
  </select>
</div>

<div id="govGrid" class="governorates-grid"></div>

<script>
  // ⚠️ حط رابط الـ Web App بتاعك هنا (لازم يكون آخر نسخة Deploy فيها doGet)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJZ8G0DbhhdqoX_BP5v03gkfkHeWGAZdoZLGFfx5H29DmGyauc8D47ivjdegwV800/exec';

  const REFRESH_INTERVAL = 10000; // 10 ثواني
  let lastData = null;
  let searchTerm = '';
  let sortMode = 'count_desc';

  const loadingOverlay = document.getElementById('loadingOverlay');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const errorBanner = document.getElementById('errorBanner');
  const lastUpdatedEl = document.getElementById('lastUpdated');
  const totalNumEl = document.getElementById('totalNum');
  const govGridEl = document.getElementById('govGrid');

  function onSearchChange(val) {
    searchTerm = val.trim();
    if (lastData) render(lastData);
  }
  function onSortChange(val) {
    sortMode = val;
    if (lastData) render(lastData);
  }

  function renderEntityList(byEntity) {
    if (!byEntity.length) return '<div class="empty-note">لا يوجد بيانات اتحادات</div>';
    return byEntity.map(ent => `
      <div class="entity-item">
        <span class="name">${ent.entity}</span>
        <span class="nums"><b>${ent.count}</b> مسجل &middot; ${ent.certs} شهادة</span>
      </div>
    `).join('');
  }

  function renderReferrers(referrers) {
    if (!referrers.length) return '';
    return `
      <div class="section-label">👥 المرشحين (YLY)</div>
      <div class="referrers-box">
        ${referrers.map(r => `
          <div class="referrer-item">
            <span class="rname">${r.name}</span>
            <span class="rnums">رشّح <b>${r.referredCount}</b> &middot; متابع: ${r.followersCount} &middot; شهادات: ${r.totalCerts}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderWinner(winner) {
    if (!winner) return '';
    return `
      <div class="winner-box">
        <div class="trophy">🏆</div>
        <div class="info">
          <div class="wname">${winner.name}</div>
          <div class="wstats">رشّح ${winner.referredCount} صديق &middot; ${winner.followersCount} متابع فيسبوك &middot; ${winner.totalCerts} شهادة إجمالي</div>
        </div>
      </div>
    `;
  }

  function renderGovCard(name, gov) {
    return `
      <div class="gov-card">
        <div class="gov-header">
          <h3>${name}</h3>
          <span class="gov-total-badge">${gov.total} مسجل</span>
        </div>
        <div class="gov-body">
          <div class="stat-row"><span>إجمالي الشهادات</span><span class="val">${gov.totalCerts}</span></div>
          <div class="stat-row"><span>أصدقاء مرشحين</span><span class="val">${gov.friendReferredCount}</span></div>

          <div class="section-label">📊 التوزيع حسب الاتحاد</div>
          <div class="entity-list">${renderEntityList(gov.byEntity)}</div>

          ${renderReferrers(gov.referrers)}
          ${renderWinner(gov.winner)}
        </div>
      </div>
    `;
  }

  function render(data) {
    totalNumEl.innerText = data.totalCount;

    let entries = Object.keys(data.governorates).map(name => ({ name: name, gov: data.governorates[name] }));

    if (searchTerm) {
      entries = entries.filter(e => e.name.includes(searchTerm));
    }

    if (sortMode === 'count_desc') {
      entries.sort((a, b) => b.gov.total - a.gov.total);
    } else if (sortMode === 'count_asc') {
      entries.sort((a, b) => a.gov.total - b.gov.total);
    } else {
      entries.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    }

    if (entries.length === 0) {
      govGridEl.innerHTML = '<div class="empty-note" style="grid-column:1/-1; padding:30px;">لا يوجد نتائج مطابقة</div>';
      return;
    }

    govGridEl.innerHTML = entries.map(e => renderGovCard(e.name, e.gov)).join('');
  }

  async function fetchData() {
    try {
      const res = await fetch(SCRIPT_URL, { method: 'GET' });
      const data = await res.json();

      if (data.status !== 'success') {
        throw new Error(data.message || 'حدث خطأ في جلب البيانات');
      }

      lastData = data;
      render(data);

      lastUpdatedEl.innerText = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG');
      statusDot.classList.remove('error');
      statusText.innerText = 'بيتحدث كل 10 ثواني';
      errorBanner.classList.add('hidden');

    } catch (err) {
      console.error(err);
      statusDot.classList.add('error');
      statusText.innerText = 'فشل التحديث';
      errorBanner.classList.remove('hidden');
      errorBanner.innerText = 'حصل خطأ: ' + err.message;
    } finally {
      loadingOverlay.classList.add('hidden');
    }
  }

  fetchData();
  setInterval(fetchData, REFRESH_INTERVAL);
</script>

</body>
</html>
