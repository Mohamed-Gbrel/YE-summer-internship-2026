<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التسجيلات - YE Summer Internship 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e31b23;
            --primary-hover: #c41219;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-color: #111111;
            --muted-text: #666666;
            --border-color: #eeeeee;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 20px 15px;
        }

        /* ===== شاشة الدخول ===== */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .login-card p {
            font-size: 14px;
            color: var(--muted-text);
            margin-bottom: 25px;
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f4b2b5;
            border-radius: 14px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-red);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .login-card button:hover {
            background-color: var(--primary-hover);
        }

        .login-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginError {
            color: var(--primary-red);
            font-size: 14px;
            font-weight: 700;
            margin-top: 12px;
            min-height: 18px;
        }

        /* ===== الداشبورد ===== */
        #dashboardScreen {
            display: none;
            max-width: 900px;
            margin: 0 auto;
        }

        #dashboardScreen.active {
            display: block;
        }

        .dash-header {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dash-total {
            display: flex;
            flex-direction: column;
        }

        .dash-total .number {
            font-size: 42px;
            font-weight: 900;
            color: var(--primary-red);
            line-height: 1;
        }

        .dash-total .label {
            font-size: 14px;
            color: var(--muted-text);
            margin-top: 4px;
        }

        .dash-meta {
            text-align: left;
            direction: ltr;
        }

        .dash-meta .updated {
            font-size: 12px;
            color: var(--muted-text);
            margin-bottom: 8px;
        }

        .refresh-btn {
            background-color: #f0f0f0;
            color: var(--text-color);
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background-color: #e5e5e5;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 25px 0 12px;
            color: var(--text-color);
        }

        /* ===== الفايزين ===== */
        .winners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 10px;
        }

        .winner-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px 18px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            border-right: 4px solid var(--primary-red);
        }

        .winner-card .gov-name {
            font-size: 13px;
            color: var(--muted-text);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .winner-card .winner-name {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .winner-card .winner-stats {
            font-size: 13px;
            color: var(--muted-text);
        }

        /* ===== جدول المحافظات ===== */
        .gov-details {
            background: var(--card-bg);
            border-radius: 18px;
            margin-bottom: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .gov-details summary {
            padding: 16px 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
        }

        .gov-details summary::-webkit-details-marker {
            display: none;
        }

        .gov-summary-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted-text);
        }

        .gov-summary-stats b {
            color: var(--text-color);
        }

        .entity-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .entity-table th,
        .entity-table td {
            padding: 10px 20px;
            text-align: right;
            border-top: 1px solid var(--border-color);
        }

        .entity-table th {
            color: var(--muted-text);
            font-weight: 700;
            font-size: 12px;
        }

        #emptyState {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted-text);
        }

        @media (max-width: 480px) {
            .dash-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .dash-meta {
                text-align: right;
                direction: rtl;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ===== شاشة الدخول ===== -->
    <div id="loginScreen">
        <div class="login-card">
            <h1>لوحة تحكم التسجيلات</h1>
            <p>أدخل كلمة المرور للمتابعة</p>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off">
            <button id="loginBtn" onclick="attemptLogin()">دخول</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- ===== الداشبورد ===== -->
    <div id="dashboardScreen">
        <div class="dash-header">
            <div class="dash-total">
                <div class="number" id="totalCount">0</div>
                <div class="label">إجمالي التسجيلات</div>
            </div>
            <div class="dash-meta">
                <div class="updated" id="lastUpdated"></div>
                <button class="refresh-btn" onclick="fetchDashboardData()">تحديث البيانات</button>
            </div>
        </div>

        <div id="winnersSection"></div>

        <div class="section-title">التسجيلات حسب المحافظة</div>
        <div id="governoratesList"></div>

        <div id="emptyState" style="display: none;">لا توجد بيانات تسجيل بعد.</div>
    </div>

<script>
    // ⚠️ حط هنا رابط الـ Apps Script الجديد بتاع الداشبورد (بعد الديبلوي)
    const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbyA4fLxOWnoCT12Wd0GLzNlK8DFAEWhPzADkRT5SCSWaTNQOqqMnDJ5Wtq14CXh528h/exec';

    let currentPassword = ""; // بيتخزن في الذاكرة بس (متغير JS)، مش localStorage
                               // فبيتمسح تلقائيًا لما الصفحة تتقفل أو تتعمل reload

    async function attemptLogin() {
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const password = passwordInput.value;

        if (!password) {
            loginError.innerText = "برجاء إدخال كلمة المرور.";
            return;
        }

        loginBtn.disabled = true;
        loginBtn.innerText = "جاري التحقق...";
        loginError.innerText = "";

        currentPassword = password;
        const success = await fetchDashboardData();

        loginBtn.disabled = false;
        loginBtn.innerText = "دخول";

        if (!success) {
            currentPassword = "";
            passwordInput.value = "";
        }
    }

   // الكود المعدل في الـ HTML
async function fetchDashboardData() {
    const loginError = document.getElementById('loginError');
    try {
        // ⚠️ مهم جداً: استخدام redirect: 'follow' ضروري مع Apps Script
        const response = await fetch(DASHBOARD_URL, {
            method: 'POST',
            // هنشيل السطر بتاع Content-Type خالص عشان نمنع متصفح جوجل من عمل preflight request (CORS)
            body: JSON.stringify({ password: currentPassword }),
            redirect: 'follow' // السطر ده سحري ومهم جداً مع Apps Script
        });

        const result = await response.json();

        // ... باقي الكود زي ما هو ...

            if (result.status !== "success") {
                loginError.innerText = result.message || "حدث خطأ، برجاء المحاولة مرة أخرى.";
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('dashboardScreen').classList.remove('active');
                return false;
            }

            renderDashboard(result);
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').classList.add('active');
            return true;

        } catch (err) {
            console.error(err);
            loginError.innerText = "تعذر الاتصال بالخادم، تأكد من اتصالك بالإنترنت.";
            return false;
        }
    }

    function renderDashboard(data) {
        document.getElementById('totalCount').innerText = data.totalCount;
        document.getElementById('lastUpdated').innerText = "آخر تحديث: " + formatDate(data.lastUpdated);

        const govNames = Object.keys(data.governorates);

        if (govNames.length === 0) {
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('winnersSection').innerHTML = '';
            document.getElementById('governoratesList').innerHTML = '';
            return;
        }

        document.getElementById('emptyState').style.display = 'none';

        // ===== قسم الفايزين =====
        const winnersHtml = govNames
            .filter(gov => data.governorates[gov].winner)
            .map(gov => {
                const w = data.governorates[gov].winner;
                return `
                    <div class="winner-card">
                        <div class="gov-name">${escapeHtml(gov)}</div>
                        <div class="winner-name">${escapeHtml(w.name)}</div>
                        <div class="winner-stats">${w.referredCount} ترشيح · ${w.followersCount} متابع</div>
                    </div>
                `;
            }).join('');

        if (winnersHtml) {
            document.getElementById('winnersSection').innerHTML = `
                <div class="section-title">الفائزين (الأكثر ترشيحاً - YLY)</div>
                <div class="winners-grid">${winnersHtml}</div>
            `;
        } else {
            document.getElementById('winnersSection').innerHTML = '';
        }

        // ===== جدول المحافظات (كل محافظة قابلة للفتح لعرض تفاصيل الاتحادات) =====
        const govsHtml = govNames.map(gov => {
            const g = data.governorates[gov];
            const entityRows = g.byEntity.map(e => `
                <tr>
                    <td>${escapeHtml(e.entity)}</td>
                    <td>${e.count}</td>
                    <td>${e.certs}</td>
                </tr>
            `).join('');

            return `
                <details class="gov-details">
                    <summary>
                        <span>${escapeHtml(gov)}</span>
                        <span class="gov-summary-stats">
                            <span><b>${g.total}</b> تسجيل</span>
                            <span><b>${g.totalCerts}</b> شهادة</span>
                        </span>
                    </summary>
                    <table class="entity-table">
                        <thead>
                            <tr><th>الاتحاد</th><th>عدد المسجلين</th><th>الشهادات</th></tr>
                        </thead>
                        <tbody>${entityRows}</tbody>
                    </table>
                </details>
            `;
        }).join('');

        document.getElementById('governoratesList').innerHTML = govsHtml;
    }

    // بيحول أي نص لصيغة آمنة قبل إدراجه في الصفحة (حماية من XSS)
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        try {
            const d = new Date(dateStr);
            return d.toLocaleString('ar-EG');
        } catch (e) {
            return dateStr;
        }
    }

    document.getElementById('passwordInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            attemptLogin();
        }
    });
</script>
</body>
</html>
