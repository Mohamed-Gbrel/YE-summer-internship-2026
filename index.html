<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YE Summer Internship 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .main-card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            border-radius: 35px;
            padding: 50px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .closed-title {
            font-size: clamp(22px, 5vw, 26px);
            font-weight: 900;
            color: #111111;
            margin-bottom: 12px;
        }

        .closed-subtitle {
            font-size: 16px;
            font-weight: 600;
            color: #555555;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="main-card">
    <h1 class="closed-title">التسجيل مغلق مؤقتاً</h1>
    <p class="closed-subtitle">برجاء المحاولة لاحقاً.</p>
</div>

</body>
</html>
