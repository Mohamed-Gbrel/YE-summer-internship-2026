<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YE Summer Internship 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e31b23;
            --primary-hover: #c41219;
            --box-border: #f4b2b5;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-color: #111111;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px; /* تحسين الهوامش الجانبية */
        }

        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px; /* تم التكبير قليلاً ليتناسب مع اللابتوب */
            border-radius: 35px;
            padding: 40px 30px; /* مساحات داخلية أفضل */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            text-align: center;
            font-size: clamp(22px, 5vw, 26px); /* خط متجاوب */
            font-weight: 900;
            color: var(--text-color);
            margin-bottom: 25px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .main-title span {
            display: block;
            font-size: clamp(24px, 6vw, 28px); /* خط متجاوب */
        }

        .form-step {
            display: none;
            width: 100%;
        }

        .form-step.active {
            display: block;
        }

        .input-card {
            border: 2px solid var(--box-border);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 20px;
            background-color: #ffffff;
            width: 100%;
        }

        .input-card label {
            display: block;
            font-size: 16px; /* تصغير طفيف ليتناسب مع كل الشاشات */
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
            text-align: right;
        }

        .input-card input[type="text"],
        .input-card select,
        .input-card input[type="file"] {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            color: #333;
            background: transparent;
            padding: 8px 0;
            max-width: 100%;
        }

        .input-card input[type="text"] {
            border-bottom: 2px solid var(--primary-red);
        }

        .input-card select {
            cursor: pointer;
            color: #555;
        }

        /* تنسيق الأزرار ليكون متجاوباً */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
            flex-wrap: wrap; /* السماح بالتوزيع في سطرين إن لزم الأمر */
        }

        .btn-next, .btn-prev {
            flex: 1; /* لجعل الأزرار تأخذ مساحة متساوية */
            min-width: 120px; /* أقل عرض مسموح به */
            font-weight: 800;
            border: none;
            border-radius: 50px;
            padding: 12px 20px; /* تعديل المسافات الداخلية */
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-next {
            background-color: var(--primary-red);
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 6px 15px rgba(227, 27, 35, 0.3);
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-prev {
            background-color: #6c757d;
            color: #ffffff;
            font-size: 18px;
        }

        .btn-prev:hover {
            background-color: #5a6268;
        }

        .hidden {
            display: none !important;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
        }

        /* --- تنسيقات اللوجوهات (Responsive) --- */
        .logos-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; 
            margin-bottom: 25px;
            direction: ltr; 
        }

        .top-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            flex-wrap: wrap; /* السماح بالنزول لسطر جديد في الشاشات الصغيرة جداً */
        }

        /* تحويل المقاسات الثابتة لمقاسات مرنة */
        .top-logos img {
            max-height: 75px; 
            width: auto;
            max-width: 30%;
            object-fit: contain;
        }

        .top-logos img:nth-child(3) {
            max-height: 90px; 
        }

        .entities-logos {
            display: flex;
            justify-content: center; 
            align-items: center;
            flex-wrap: wrap; /* ضروري لعدم تشويه اللوجوهات في الموبايل */
            width: 100%;
            gap: 8px; 
        }

        .entities-logos img {
            max-height: 65px; 
            width: auto;
            max-width: 18%; /* لتوزيعها بانتظام */
            min-width: 45px; /* ضمان عدم صغرها بشكل يمنع القراءة */
            object-fit: contain;
        }

        /* --- استعلامات الوسائط (Media Queries) للهواتف --- */
        @media (max-width: 480px) {
            .main-card {
                padding: 30px 20px;
                border-radius: 25px;
            }

            .input-card {
                padding: 15px;
            }

            .top-logos img {
                max-height: 60px;
            }

            .top-logos img:nth-child(3) {
                max-height: 70px;
            }

            .entities-logos img {
                max-height: 50px;
                max-width: 30%; /* السماح بحجم أكبر قليلاً مع نزولها سطر جديد إذا لزم الأمر */
            }

            .btn-next, .btn-prev {
                font-size: 18px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

<div class="main-card">
    
    <!-- قسم اللوجوهات -->
    <div class="logos-container">
        <div class="top-logos">
            <img src="photo_5796201732420341509_y.jpg" alt="Youth Empowered">
            <img src="photo_5796201732420341515_y.jpg" alt="YLY">
            <img src="photo_5796201732420341513_y.jpg" alt="Ministry of Youth and Sports">
        </div>

        <div class="entities-logos">
            <img src="photo_5796201732420341516_y.jpg" alt="الاتحاد الوطني">
            <img src="photo_5796201732420341514_y.jpg" alt="شباب العمال">
            <img src="photo_5796201732420341511_y.jpg" alt="تحيا مصر">
            <img src="photo_5796201732420341510_y.jpg" alt="بشبابها">
            <img src="photo_5796201732420341512_y.jpg" alt="الكيانات الشبابية">
        </div>
    </div>

    <h1 class="main-title">
        YE Summer Internship
        <span>2026</span>
    </h1>

    <form id="competitionForm" style="width: 100%;">
        
        <!-- STEP 1 -->
        <div class="form-step active" id="step-1">
            <div class="input-card">
                <label>الاسم الثلاثي:</label>
                <input type="text" id="fullName" placeholder="اكتب اسمك الثلاثي" required>
            </div>

            <div class="input-card">
                <label>عرفت التدريب منين؟:</label>
                <select id="regType" required onchange="handleRegTypeChange()">
                    <option value="">Choose</option>
                    <option value="عضو باتحاد شبابي">عضو باتحاد شبابي</option>
                    <option value="صديق مرشح من عضو باتحاد شبابي">صديق مرشح من عضو باتحاد شبابي</option>
                </select>
            </div>

            <div class="btn-container">
                <button type="button" class="btn-next" onclick="nextStep(1)">Next</button>
            </div>
        </div>

        <!-- STEP 2 -->
        <div class="form-step" id="step-2">
            
            <div id="friendFields" class="input-card hidden">
                <label>اسم صديقك ثلاثي (اللي رشحلك التدريب):</label>
                <input type="text" id="friendName" placeholder="اسم صديقك الثلاثي">
            </div>

            <div class="input-card">
                <label id="entityLabel">الاتحاد المنضم إليه:</label>
                <select id="entity" required onchange="handleEntityChange()">
                    <option value="">Choose</option>
                    <option value="اتحاد شباب العمال">اتحاد شباب العمال</option>
                    <option value="الاتحاد المصري للكيانات الشبابيه">الاتحاد المصري للكيانات الشبابيه</option>
                    <option value="اتحاد بشبابها">اتحاد بشبابها</option>
                    <option value="اتحاد الوطني للقيادات الشبابيه">اتحاد الوطني للقيادات الشبابيه</option>
                    <option value="اتحاد شباب تحيا مصر">اتحاد شباب تحيا مصر</option>
                    <option value="اتحاد شباب يدير شباب - YLY">اتحاد شباب يدير شباب - YLY</option>
                </select>
            </div>

            <div class="input-card">
                <label>المحافظة / التيم التابع له:</label>
                <select id="governorate" required>
                    <option value="">Choose</option>
                </select>
            </div>

            <div id="ylyFbQuestion" class="input-card hidden">
                <label>هل انت متابع لصفحة الاتحاد الرسمية على الفيسبوك؟</label>
                <select id="isFollowingFb" onchange="handleFbChange()">
                    <option value="">Choose</option>
                    <option value="نعم">نعم</option>
                    <option value="لا">لا</option>
                </select>
            </div>

            <div id="fbScreenshotGroup" class="input-card hidden">
                <label>حط اسكرين لمتابعة صفحة الفيسبوك:</label>
                <input type="file" id="fbScreenshot" accept="image/*">
            </div>

            <div class="btn-container">
                <button type="button" class="btn-prev" onclick="prevStep(2)">Back</button>
                <button type="button" class="btn-next" onclick="nextStep(2)">Next</button>
            </div>
        </div>

        <!-- STEP 3 -->
        <div class="form-step" id="step-3">
            <div class="input-card">
                <label>الاسم/ الاسماء المستخدمة في الموقع (كما في الشهادات):</label>
                <input type="text" id="namesOnCertificates" placeholder="اكتب الاسماء المستخدمة" required>
            </div>

            <div class="input-card">
                <label>شهادة 1 (إجباري):</label>
                <input type="file" id="cert1" accept="image/*" required>
            </div>

            <div class="input-card">
                <label>شهادة 2 (اختياري):</label>
                <input type="file" id="cert2" accept="image/*">
            </div>

            <div class="input-card">
                <label>شهادة 3 (اختياري):</label>
                <input type="file" id="cert3" accept="image/*">
            </div>

            <div class="input-card">
                <label>شهادة 4 (اختياري):</label>
                <input type="file" id="cert4" accept="image/*">
            </div>

            <div class="btn-container">
                <button type="button" class="btn-prev" onclick="prevStep(3)">Back</button>
                <button type="submit" id="submitBtn" class="btn-next">Submit</button>
            </div>
        </div>

    </form>

    <div id="message"></div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPvmuYbVibnhlbToybuWAsFwXQpn8YHRRChxFeOFPs9uABS862oBjXsB5KXxSrDGWX/exec';

    const standardGovernorates = [
        "القاهرة", "الجيزة", "الإسكندرية", "الدقهلية", "الشرقية", "القليوبية", "كفر الشيخ", "المنوفية", 
        "الغربية", "البحيرة", "الإسماعيلية", "بورسعيد", "السويس", "المنيا", "بني سويف", "الفيوم", 
        "أسيوط", "سوهاج", "قنا", "الأقصر", "أسوان", "البحر الأحمر", "الوادي الجديد", "مطروح", "شمال سيناء", "جنوب سيناء"
    ];

    let currentStep = 1;

    function handleRegTypeChange() {
        const regType = document.getElementById('regType').value;
        const friendFields = document.getElementById('friendFields');
        const entityLabel = document.getElementById('entityLabel');

        if (regType === "صديق مرشح من عضو باتحاد شبابي") {
            friendFields.classList.remove('hidden');
            document.getElementById('friendName').required = true;
            entityLabel.innerText = "الاتحاد التابع له صديقك:";
        } else {
            friendFields.classList.add('hidden');
            document.getElementById('friendName').required = false;
            entityLabel.innerText = "الاتحاد المنضم إليه:";
        }
        handleEntityChange();
    }

    function handleEntityChange() {
        const entity = document.getElementById('entity').value;
        const govSelect = document.getElementById('governorate');
        const ylyFbQuestion = document.getElementById('ylyFbQuestion');
        
        govSelect.innerHTML = '<option value="">Choose</option>';
        
        let list = [...standardGovernorates];
        if (entity === "اتحاد شباب يدير شباب - YLY") {
            list.unshift("تيم الوزارة", "تيم العاصمة");
            ylyFbQuestion.classList.remove('hidden');
            document.getElementById('isFollowingFb').required = true;
        } else {
            ylyFbQuestion.classList.add('hidden');
            document.getElementById('isFollowingFb').required = false;
        }

        list.forEach(gov => {
            const opt = document.createElement('option');
            opt.value = gov;
            opt.innerText = gov;
            govSelect.appendChild(opt);
        });

        handleFbChange();
    }

    function handleFbChange() {
        const regType = document.getElementById('regType').value;
        const entity = document.getElementById('entity').value;
        const isFollowingFb = document.getElementById('isFollowingFb').value;
        const fbScreenshotGroup = document.getElementById('fbScreenshotGroup');
        const fbScreenshotInput = document.getElementById('fbScreenshot');

        if (regType === "صديق مرشح من عضو باتحاد شبابي" && entity === "اتحاد شباب يدير شباب - YLY" && isFollowingFb === "نعم") {
            fbScreenshotGroup.classList.remove('hidden');
            fbScreenshotInput.required = true;
        } else {
            fbScreenshotGroup.classList.add('hidden');
            fbScreenshotInput.required = false;
        }
    }

    function nextStep(step) {
        if (step === 1) {
            if (!document.getElementById('fullName').value || !document.getElementById('regType').value) {
                alert("يرجى كتابة الاسم الثلاثي واختيار إجابة السؤال.");
                return;
            }
        } else if (step === 2) {
            if (!document.getElementById('entity').value || !document.getElementById('governorate').value) {
                alert("يرجى اختيار الاتحاد والمحافظة.");
                return;
            }
        }
        document.getElementById(`step-${step}`).classList.remove('active');
        currentStep = step + 1;
        document.getElementById(`step-${currentStep}`).classList.add('active');
    }

    function prevStep(step) {
        document.getElementById(`step-${step}`).classList.remove('active');
        currentStep = step - 1;
        document.getElementById(`step-${currentStep}`).classList.add('active');
    }

    // دالة فحص وتصغير الصور (مُعدلة لحظر أكثر من 1 ميجا والضغط الفائق)
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(null); return; }
            
            // فحص الحجم: إذا كان أكبر من 1 ميجابايت (1,048,576 بايت)
            if (file.size > 1024 * 1024) {
                alert(`الملف "${file.name}" حجمه أكبر من 1 ميجابايت! يرجى اختيار ملف بحجم أقل.`);
                reject(new Error("File size limit exceeded"));
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; // تصغير العرض لتخفيف المعالجة
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // ضغط الجودة لـ 40% (كافية لرؤية البيانات ومساحتها صغيرة جداً)
                    const base64 = canvas.toDataURL('image/jpeg', 0.4).split(',')[1];
                    resolve({ name: file.name, base64: base64 });
                };
            };
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('competitionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        submitBtn.disabled = true;
        submitBtn.innerText = "جاري الإرسال...";
        messageDiv.innerText = "";

        try {
            const filesData = {
                fbScreenshot: await compressImage(document.getElementById('fbScreenshot').files[0]),
                cert1: await compressImage(document.getElementById('cert1').files[0]),
                cert2: await compressImage(document.getElementById('cert2').files[0]),
                cert3: await compressImage(document.getElementById('cert3').files[0]),
                cert4: await compressImage(document.getElementById('cert4').files[0]),
            };

            const payload = {
                registrationType: document.getElementById('regType').value,
                fullName: document.getElementById('fullName').value,
                friendName: document.getElementById('friendName').value,
                entity: document.getElementById('entity').value,
                governorate: document.getElementById('governorate').value,
                isFollowingFb: document.getElementById('isFollowingFb').value,
                namesOnCertificates: document.getElementById('namesOnCertificates').value,
                files: filesData
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    messageDiv.style.color = "green";
                    messageDiv.innerText = "تم التسجيل ورفع كافة البيانات والشهادات بنجاح!";
                    document.getElementById('competitionForm').reset();
                    setTimeout(() => { location.reload(); }, 3000);
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                messageDiv.style.color = "red";
                messageDiv.innerText = "حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.";
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit";
            });

        } catch (err) {
            // في حالة كان حجم الملف أطول من 1 ميجا
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
        }
    });

</script>

</body>
</html>
