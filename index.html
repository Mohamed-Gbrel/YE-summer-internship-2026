<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YE Summer Internship 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e31b23;
            --primary-hover: #c41219;
            --box-border: #f4b2b5;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-color: #111111;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 35px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            text-align: center;
            font-size: clamp(22px, 5vw, 26px);
            font-weight: 900;
            color: var(--text-color);
            margin-bottom: 25px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .main-title span {
            display: block;
            font-size: clamp(24px, 6vw, 28px);
        }

        .form-step {
            display: none;
            width: 100%;
        }

        .form-step.active {
            display: block;
        }

        .input-card {
            border: 2px solid var(--box-border);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 20px;
            background-color: #ffffff;
            width: 100%;
        }

        .input-card label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
            text-align: right;
        }

        .input-card input[type="text"],
        .input-card textarea,
        .input-card select,
        .input-card input[type="file"] {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            color: #333;
            background: transparent;
            padding: 8px 0;
            max-width: 100%;
        }

        .input-card input[type="text"],
        .input-card textarea {
            border-bottom: 2px solid var(--primary-red);
            resize: vertical;
        }

        .input-card select {
            cursor: pointer;
            color: #555;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
            flex-wrap: wrap;
        }

        .btn-next, .btn-prev {
            flex: 1;
            min-width: 120px;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-next {
            background-color: var(--primary-red);
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 6px 15px rgba(227, 27, 35, 0.3);
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-prev {
            background-color: #6c757d;
            color: #ffffff;
            font-size: 18px;
        }

        .btn-prev:hover {
            background-color: #5a6268;
        }

        .hidden {
            display: none !important;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
        }

        .logos-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; 
            margin-bottom: 25px;
            direction: ltr; 
        }

        .top-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 0;
            direction: ltr;
        }

        .top-logos img,
        .entities-logos img {
            display: block;
            width: 100%;
            height: 68px;
            min-width: 0;
            margin: 0;
            padding: 0;
            object-fit: contain;
            object-position: center;
        }

        .top-logos img {
            height: 75px;
            width: auto; 
        }

        .entities-logos {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            align-items: center;
            width: 100%;
            gap: 0;
            direction: ltr;
        }

        .entities-logos img:nth-child(4) {
            transform: scale(1.28);
        }

     
        .developer-credit {
            margin-top: 25px;
            font-size: 14px;
            color: #6c757d;
            text-align: center;
            direction: ltr;
            letter-spacing: 0.5px;
        }

        .developer-credit span {
            color: var(--text-color);
            font-weight: 800;
            transition: color 0.3s ease;
        }

        .developer-credit span:hover {
            color: var(--primary-red);
        }
        .developer-credit a {
    color: var(--text-color);
    font-weight: 800;
    text-decoration: none; 
    transition: color 0.3s ease;
}

.developer-credit a:hover {
    color: var(--primary-red);
}

        @media (max-width: 480px) {
            .main-card {
                padding: 30px 20px;
                border-radius: 25px;
            }

            .input-card {
                padding: 15px;
            }

            .top-logos,
            .entities-logos {
                gap: 0;
            }

            .top-logos img,
            .entities-logos img {
                height: 45px;
            }

            .top-logos img {
                height: 50px;
            }

            .entities-logos img:nth-child(4) {
                transform: scale(1.2);
            }

            .btn-next, .btn-prev {
                font-size: 18px;
                padding: 10px 10px;
            }

            .developer-credit {
                font-size: 13px;
                margin-top: 20px;
            }

        }
    </style>
</head>
<body>

<div class="main-card">
    
    <div class="logos-container">
        <div class="top-logos">
            <img src="photo_5796201732420341509_y.jpg" alt="Youth Empowered">
            <img src="photo_5796201732420341515_y.jpg" alt="YLY">
            <img src="photo_5796201732420341513_y.jpg" alt="Ministry of Youth and Sports">
        </div>

        <div class="entities-logos">
            <img src="photo_5796201732420341516_y.jpg" alt="الاتحاد الوطني">
            <img src="photo_5796201732420341514_y.jpg" alt="شباب العمال">
            <img src="photo_5796201732420341511_y.jpg" alt="تحيا مصر">
            <img src="photo_5796201732420341510_y.jpg" alt="بشبابها">
            <img src="photo_5796201732420341512_y.jpg" alt="الكيانات الشبابية">
        </div>
    </div>

    <h1 class="main-title">
        YE Summer Internship
        <span>2026</span>
    </h1>

    <form id="competitionForm" style="width: 100%;">
        
       
        <div style="opacity: 0; position: absolute; top: -9999px; left: -9999px;" aria-hidden="true">
            <label for="user_url">Website</label>
            <input type="text" id="user_url" name="user_url" tabindex="-1" autocomplete="off">
        </div>

    
        <div class="form-step active" id="step-1">
            <div class="input-card">
                <label>الاسم الثلاثي:</label>
                <input type="text" id="fullName" placeholder="اكتب اسمك الثلاثي" required oninput="validateTripleName(this)">
            </div>

            <div class="input-card">
                <label>عرفت التدريب منين؟:</label>
                <select id="regType" required onchange="handleRegTypeChange()">
                    <option value="">Choose</option>
                    <option value="عضو باتحاد شبابي">عضو باتحاد شبابي</option>
                    <option value="صديق مرشح من عضو باتحاد شبابي">صديق مرشح من عضو باتحاد شبابي</option>
                </select>
            </div>

            <div class="btn-container">
                <button type="button" class="btn-next" onclick="nextStep(1)">Next</button>
            </div>
        </div>

       
        <div class="form-step" id="step-2">
            
            <div id="friendFields" class="input-card hidden">
                <label>اسم صديقك ثلاثي (اللي رشحلك التدريب):</label>
                <input type="text" id="friendName" placeholder="اسم صديقك الثلاثي بالحروف العربية الأساسية فقط" oninput="validateArabicTripleName(this)">
            </div>

            <div class="input-card">
                <label id="entityLabel">الاتحاد المنضم إليه:</label>
                <select id="entity" required onchange="handleEntityChange()">
                    <option value="">Choose</option>
                    <option value="اتحاد شباب العمال">اتحاد شباب العمال</option>
                    <option value="الاتحاد المصري للكيانات الشبابيه">الاتحاد المصري للكيانات الشبابيه</option>
                    <option value="اتحاد بشبابها">اتحاد بشبابها</option>
                    <option value="اتحاد الوطني للقيادات الشبابيه">اتحاد الوطني للقيادات الشبابيه</option>
                    <option value="اتحاد شباب تحيا مصر">اتحاد شباب تحيا مصر</option>
                    <option value="اتحاد شباب يدير شباب - YLY">اتحاد شباب يدير شباب - YLY</option>
                </select>
            </div>

            <div class="input-card">
                <label>المحافظة / التيم التابع له:</label>
                <select id="governorate" required>
                    <option value="">Choose</option>
                </select>
            </div>

            <div id="ylyFbQuestion" class="input-card hidden">
                <label>هل انت متابع لصفحة الاتحاد الرسمية على الفيسبوك؟</label>
                <select id="isFollowingFb" onchange="handleFbChange()">
                    <option value="">Choose</option>
                    <option value="نعم">نعم</option>
                    <option value="لا">لا</option>
                </select>
            </div>

            <div id="fbScreenshotGroup" class="input-card hidden">
                <label>حط اسكرين لمتابعة صفحة الفيسبوك (اختياري):</label>
                <input type="file" id="fbScreenshot" accept=".jpg, .jpeg, .png">
            </div>

            <div class="btn-container">
                <button type="button" class="btn-prev" onclick="prevStep(2)">Back</button>
                <button type="button" class="btn-next" onclick="nextStep(2)">Next</button>
            </div>
        </div>

    
        <div class="form-step" id="step-3">
            <div class="input-card">
                <label>الاسم/ الاسماء المستخدمة في الموقع (كما في الشهادات):</label>
                <textarea id="namesOnCertificates" placeholder="اكتب الأسماء المستخدمة (اضغط Enter لكتابة كل اسم في سطر جديد)" rows="3" required></textarea>
            </div>

            <div class="input-card">
                <label>شهادة 1 (إجباري):</label>
                <input type="file" id="cert1" accept=".jpg, .jpeg, .png" required>
            </div>

            <div class="input-card">
                <label>شهادة 2 (اختياري):</label>
                <input type="file" id="cert2" accept=".jpg, .jpeg, .png">
            </div>

            <div class="input-card">
                <label>شهادة 3 (اختياري):</label>
                <input type="file" id="cert3" accept=".jpg, .jpeg, .png">
            </div>

            <div class="input-card">
                <label>شهادة 4 (اختياري):</label>
                <input type="file" id="cert4" accept=".jpg, .jpeg, .png">
            </div>

            <div class="btn-container">
                <button type="button" class="btn-prev" onclick="prevStep(3)">Back</button>
                <button type="submit" id="submitBtn" class="btn-next">Submit</button>
            </div>
        </div>

    </form>

    <div id="message"></div>
</div>


<div class="developer-credit">
    Designed & Developed by <a href="https://wa.me/201064683942" target="_blank" rel="noopener noreferrer">Mohamed Gbrel</a>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPvmuYbVibnhlbToybuWAsFwXQpn8YHRRChxFeOFPs9uABS862oBjXsB5KXxSrDGWX/exec';
    
   
    const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/gqxqvxhe/upload';
    const CLOUDINARY_PRESET = 'ye_intern_preset';

    const standardGovernorates = [
        "القاهرة", "الجيزة", "الإسكندرية", "الدقهلية", "الشرقية", "القليوبية", "كفر الشيخ", "المنوفية", 
        "الغربية", "البحيرة", "الإسماعيلية", "بورسعيد", "السويس", "المنيا", "بني سويف", "الفيوم", 
        "أسيوط", "سوهاج", "قنا", "الأقصر", "أسوان", "البحر الأحمر", "الوادي الجديد", "مطروح", "شمال سيناء", "جنوب سيناء"
    ];

    let currentStep = 1;

    function validateTripleName(input) {
        if (input.value.trim() === "") {
            input.setCustomValidity("");
            return;
        }
        const words = input.value.trim().split(/\s+/);
        if (words.length < 3) {
            input.setCustomValidity("برجاء إدخال الاسم ثلاثي على الأقل (3 كلمات).");
        } else {
            input.setCustomValidity("");
        }
    }

    function validateArabicTripleName(input) {
        if (input.value.trim() === "") {
            input.setCustomValidity("");
            return;
        }

       
        const strictArabicRegex = /^[ابتثجحخدذرزسشصضطظعغفقكلمنهوي\s]+$/;

        if (!strictArabicRegex.test(input.value)) {
            input.setCustomValidity("يجب كتابة الاسم بحروف عربية أساسية فقط (بدون همزات أ/إ/آ، بدون ة مربوطة، وبدون حروف خاصة).");
            return;
        }

        const words = input.value.trim().split(/\s+/);
        if (words.length < 3) {
            input.setCustomValidity("برجاء إدخال اسم الصديق ثلاثي على الأقل (3 كلمات).");
        } else {
            input.setCustomValidity("");
        }
    }

    function handleRegTypeChange() {
        const regType = document.getElementById('regType').value;
        const friendFields = document.getElementById('friendFields');
        const entityLabel = document.getElementById('entityLabel');
        const friendInput = document.getElementById('friendName');

        if (regType === "صديق مرشح من عضو باتحاد شبابي") {
            friendFields.classList.remove('hidden');
            friendInput.required = true;
            validateArabicTripleName(friendInput);
            entityLabel.innerText = "الاتحاد التابع له صديقك:";
        } else {
            friendFields.classList.add('hidden');
            friendInput.required = false;
            friendInput.setCustomValidity("");
        }
        handleEntityChange();
    }

    function handleEntityChange() {
        const entity = document.getElementById('entity').value;
        const govSelect = document.getElementById('governorate');
        const ylyFbQuestion = document.getElementById('ylyFbQuestion');
        
        govSelect.innerHTML = '<option value="">Choose</option>';
        
        let list = [...standardGovernorates];
        if (entity === "اتحاد شباب يدير شباب - YLY") {
            list.unshift("تيم الوزارة", "تيم العاصمة");
            ylyFbQuestion.classList.remove('hidden');
            document.getElementById('isFollowingFb').required = true;
        } else {
            ylyFbQuestion.classList.add('hidden');
            document.getElementById('isFollowingFb').required = false;
        }

        list.forEach(gov => {
            const opt = document.createElement('option');
            opt.value = gov;
            opt.innerText = gov;
            govSelect.appendChild(opt);
        });

        handleFbChange();
    }

    function handleFbChange() {
        const regType = document.getElementById('regType').value;
        const entity = document.getElementById('entity').value;
        const isFollowingFb = document.getElementById('isFollowingFb').value;
        const fbScreenshotGroup = document.getElementById('fbScreenshotGroup');
        const fbScreenshotInput = document.getElementById('fbScreenshot');

        if (regType === "صديق مرشح من عضو باتحاد شبابي" && entity === "اتحاد شباب يدير شباب - YLY" && isFollowingFb === "نعم") {
            fbScreenshotGroup.classList.remove('hidden');
            fbScreenshotInput.required = false; 
        } else {
            fbScreenshotGroup.classList.add('hidden');
            fbScreenshotInput.required = false;
        }
    }

    function nextStep(step) {
        const currentStepDiv = document.getElementById(`step-${step}`);
        const requiredInputs = currentStepDiv.querySelectorAll('input[required], select[required], textarea[required]');
        const messageDiv = document.getElementById('message');
        messageDiv.innerText = "";
        
        for (let input of requiredInputs) {
            if (!input.checkValidity()) {
                input.reportValidity(); 
                return; 
            }
        }

       
        if (step === 2) {
            const fbScreenshotInput = document.getElementById('fbScreenshot');
            const fbScreenshotGroup = document.getElementById('fbScreenshotGroup');
            
            if (!fbScreenshotGroup.classList.contains('hidden') && fbScreenshotInput.files[0]) {
                const file = fbScreenshotInput.files[0];
                const validImageTypes = ['image/jpeg', 'image/jpg', 'image/png'];
                
                if (!validImageTypes.includes(file.type)) {
                    messageDiv.style.color = "red";
                    messageDiv.innerText = `الملف "${file.name}" صيغته غير مدعومة. يرجى رفع صور بصيغة JPG أو PNG فقط.`;
                    return;
                }

                if (file.size > 1024 * 1024) {
                    messageDiv.style.color = "red";
                    messageDiv.innerText = `الملف "${file.name}" حجمه أكبر من 1 ميجابايت! يرجى اختيار ملف بحجم أقل.`;
                    return;
                }
            }
        }

        currentStepDiv.classList.remove('active');
        currentStep = step + 1;
        document.getElementById(`step-${currentStep}`).classList.add('active');
    }

    function prevStep(step) {
        document.getElementById(`step-${step}`).classList.remove('active');
        currentStep = step - 1;
        document.getElementById(`step-${currentStep}`).classList.add('active');
    }

    function compressImage(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(null); return; }
            
            const validImageTypes = ['image/jpeg', 'image/jpg', 'image/png'];
            if (!validImageTypes.includes(file.type)) {
                reject(new Error(`الملف "${file.name}" صيغته غير مدعومة. يرجى رفع صور بصيغة JPG أو PNG فقط.`));
                return;
            }

            if (file.size > 1024 * 1024) {
                reject(new Error(`الملف "${file.name}" حجمه أكبر من 1 ميجابايت! يرجى اختيار ملف بحجم أقل.`));
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.4);
                    resolve(dataUrl); 
                };
            };
            reader.readAsDataURL(file);
        });
    }

    async function uploadToCloudinary(dataUrl, folderName) {
        if (!dataUrl) return "";
        try {
            const formData = new FormData();
            formData.append("file", dataUrl);
            formData.append("upload_preset", CLOUDINARY_PRESET);
            formData.append("folder", "التسجيلات/" + folderName);

            const response = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
            const data = await response.json();
            return data.secure_url || ""; 
        } catch (error) {
            console.error("Upload error:", error);
            throw new Error("حدث خطأ أثناء رفع الصور، يرجى المحاولة مرة أخرى.");
        }
    }

    document.getElementById('competitionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const messageDiv = document.getElementById('message');
        
        const honeypot = document.getElementById('user_url').value;
        if (honeypot !== "") {
            console.warn("Spam Bot Detected!");
            messageDiv.style.color = "green";
            messageDiv.innerText = "تم التسجيل ورفع كافة البيانات والشهادات بنجاح!";
            document.getElementById('competitionForm').reset();
            return;
        }
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";
        messageDiv.innerText = "";

        try {
            const entityName = document.getElementById('entity').value || "غير_معروف";

            const fbInput = document.getElementById('fbScreenshot');
            const cert1Input = document.getElementById('cert1');
            const cert2Input = document.getElementById('cert2');
            const cert3Input = document.getElementById('cert3');
            const cert4Input = document.getElementById('cert4');

            const fbImgData = fbInput && fbInput.files[0] ? await compressImage(fbInput.files[0]) : null;
            const cert1Data = cert1Input && cert1Input.files[0] ? await compressImage(cert1Input.files[0]) : null;
            const cert2Data = cert2Input && cert2Input.files[0] ? await compressImage(cert2Input.files[0]) : null;
            const cert3Data = cert3Input && cert3Input.files[0] ? await compressImage(cert3Input.files[0]) : null;
            const cert4Data = cert4Input && cert4Input.files[0] ? await compressImage(cert4Input.files[0]) : null;

            const filesData = {
                fbScreenshot: await uploadToCloudinary(fbImgData, entityName),
                cert1: await uploadToCloudinary(cert1Data, entityName),
                cert2: await uploadToCloudinary(cert2Data, entityName),
                cert3: await uploadToCloudinary(cert3Data, entityName),
                cert4: await uploadToCloudinary(cert4Data, entityName),
            };

            const payload = {
                registrationType: document.getElementById('regType').value,
                fullName: document.getElementById('fullName').value,
                friendName: document.getElementById('friendName').value,
                entity: document.getElementById('entity').value,
                governorate: document.getElementById('governorate').value,
                isFollowingFb: document.getElementById('isFollowingFb').value,
                namesOnCertificates: document.getElementById('namesOnCertificates').value,
                files: filesData
            };

            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            messageDiv.style.color = "green";
            messageDiv.innerText = "تم التسجيل ورفع كافة البيانات والشهادات بنجاح!";
            document.getElementById('competitionForm').reset();
            setTimeout(() => { location.reload(); }, 3000);

        } catch (err) {
            console.error(err);
            messageDiv.style.color = "red";
            messageDiv.innerText = err.message || "حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.";
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
        }
    });
</script>
</body>
</html>
